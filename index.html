<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0d67c5" />
<title>E-BIKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3fb;
  --panel:#fff;
  --panel2:#f8fbff;
  --text:#152033;
  --muted:#6f7d91;
  --blue:#0d67c5;
  --blue2:#176fca;
  --green:#2aa84f;
  --line:#d7e1ec;
  --shadow:0 10px 22px rgba(18,28,45,.12);
  --ok:#21a455;
  --warn:#f0b429;
  --danger:#ef5350;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:Rajdhani,system-ui,sans-serif;color:var(--text);overflow:hidden}
body{padding:0;touch-action:manipulation}
.page{width:min(430px,100vw);height:100vh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.topbar{
  height:66px;
  background:linear-gradient(180deg,var(--blue2),var(--blue));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  box-shadow:var(--shadow);
  border-bottom-left-radius:20px;
  border-bottom-right-radius:20px;
  flex:0 0 auto;
}
.brand{display:flex;align-items:center;gap:8px;font:700 18px/1 Barlow Condensed,sans-serif;letter-spacing:2px}
.brand .bolt{font-size:18px}
.topright{display:flex;gap:8px;align-items:center}
.chip{
  width:24px;height:24px;border-radius:50%;
  background:rgba(255,255,255,.18);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12px
}
.content{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  padding:10px 10px 92px;
  gap:8px;
  -webkit-overflow-scrolling:touch;
}
.hero{
  background:linear-gradient(180deg,#f9fbff,#edf3fb);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  height:190px;
  display:grid;
  place-items:center;
  padding:8px 10px 10px;
}
.gauge{width:100%;max-width:295px;height:auto}
.speed{font:700 42px/1 Barlow Condensed,sans-serif;margin-top:-4px}
.unit{font-size:15px;color:var(--muted)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:10px;
  min-height:0;
}
.card.soft{background:linear-gradient(180deg,var(--panel),var(--panel2))}
.label{
  font:700 11px/1 Barlow Condensed,sans-serif;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted)
}
.value{font:700 23px/1 Barlow Condensed,sans-serif;margin-top:3px}
.mono{font-family:'Share Tech Mono',monospace;font-size:11px}
.weather{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.weather .temp{font:700 22px/1 Barlow Condensed,sans-serif}
.tripGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.batteryGrid{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.soc{font:700 40px/1 Barlow Condensed,sans-serif;color:var(--green)}
.range{font:700 34px/1 Barlow Condensed,sans-serif;color:var(--blue);text-align:right}
.bar{height:7px;background:#d5dfeb;border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#74d04b)}
.cells{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px}
.cell .n{font:700 10px/1 Barlow Condensed,sans-serif;color:var(--muted)}
.cell .mv{font:700 11px/1 'Share Tech Mono',monospace;margin-top:3px}
.miniBar{height:6px;background:#d6dfeb;border-radius:999px;overflow:hidden;margin-top:4px}
.miniBar i{display:block;height:100%;background:linear-gradient(90deg,var(--danger),var(--warn),var(--ok))}
.shortcuts{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.shortcut{
  min-height:52px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel);
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:3px;
  text-decoration:none;
  color:var(--text)
}
.shortcut .ic{font-size:20px}
.shortcut .tx{font:700 10px/1 Barlow Condensed,sans-serif;letter-spacing:.8px}
.footer{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  width:min(430px,100vw);
  background:linear-gradient(180deg,rgba(238,243,251,.12),rgba(238,243,251,.92) 22%, rgba(238,243,251,1) 100%);
  z-index:20;
  box-shadow:0 -8px 20px rgba(18,28,45,.08);
}
.status{font:700 11px/1 'Share Tech Mono',monospace;color:var(--muted)}
button{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:12px;
  box-shadow:var(--shadow);
  color:var(--text);
  padding:8px 10px;
  font:700 12px/1 Barlow Condensed,sans-serif
}
button.primary{background:linear-gradient(180deg,#2e7eea,#0d67c5);color:#fff;border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hidden{display:none}
.historyPanel{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(390px,92vw);max-height:70vh;overflow:auto;z-index:50;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 18px 40px rgba(0,0,0,.25);padding:12px
}
.backdrop{position:fixed;inset:0;background:rgba(10,18,30,.25);z-index:40}
.toastWrap{position:fixed;right:8px;bottom:8px;display:grid;gap:6px;z-index:9999}
.toast{background:rgba(18,25,40,.95);color:#fff;padding:10px 12px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:min(340px,90vw)}
@media (max-height:780px){
  .hero{height:178px}
  .content{gap:7px;padding:8px 10px 92px}
  .value{font-size:21px}
  .soc{font-size:38px}
  .range{font-size:31px}
  .cells{grid-template-columns:repeat(7,1fr)}
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand"><span class="bolt">⚡</span><span>E-BIKE</span></div>
    <div class="topright">
      <span class="chip" id="protoTop">A</span>
      <button id="gpsBtn">GPS</button>
      <button id="connectBtn">BMS</button>
    </div>
  </div>

  <div class="content">
    <div class="hero">
      <svg class="gauge" viewBox="0 0 320 220">
        <defs>
          <linearGradient id="g1" x1="0" x2="1">
            <stop offset="0%" stop-color="#ff6d6d"/>
            <stop offset="55%" stop-color="#ffd166"/>
            <stop offset="100%" stop-color="#2aa84f"/>
          </linearGradient>
        </defs>
        <path d="M42 170 A118 118 0 0 1 278 170" fill="none" stroke="#cfd8e4" stroke-width="20" stroke-linecap="round"/>
        <path id="arc" d="M42 170 A118 118 0 0 1 278 170" fill="none" stroke="url(#g1)" stroke-width="20" stroke-linecap="round" stroke-dasharray="0 999"/>
        <g id="needle" transform="translate(160 170)">
          <line x1="0" y1="0" x2="0" y2="-92" stroke="#1d2430" stroke-width="4" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="8" fill="#1d2430"/>
        </g>
        <text x="160" y="188" text-anchor="middle" class="mono" fill="#687689">KM/H</text>
      </svg>
      <div class="speed"><span id="speed">0.0</span><span class="unit"> km/h</span></div>
    </div>

    <div class="pairs">
      <div class="card">
        <div class="label">LUMI / OGGI</div>
        <div class="value" id="clock">18:52:12</div>
        <div class="mono" id="date">gio 04/06/2026</div>
      </div>
      <div class="card">
        <div class="label">DISTANZA</div>
        <div class="value"><span id="distance">0.03</span> km</div>
        <div class="mono">GPS</div>
      </div>
    </div>

    <div class="card soft weather">
      <div style="font-size:24px">⛅</div>
      <div>
        <div class="temp"><span id="temp">26.8</span> °C</div>
        <div class="mono">Milano</div>
      </div>
      <div style="text-align:right">
        <div class="mono">14 km/h</div>
        <div class="mono">58%</div>
      </div>
    </div>

    <div class="card soft">
      <div class="label">Trip</div>
      <div class="tripGrid" style="margin-top:6px">
        <div>
          <div class="label">ODO</div>
          <div class="value"><span id="odo">0.03</span> km</div>
        </div>
        <div style="text-align:right">
          <div class="label">V. media</div>
          <div class="value"><span id="avgSpeed">0.4</span> km/h</div>
        </div>
      </div>
    </div>

    <div class="card soft batteryGrid">
      <div>
        <div class="label">Batteria</div>
        <div class="soc"><span id="soc">80</span>%</div>
        <div class="mono" id="packInfo">16.1 / 20 Ah</div>
        <div class="bar"><i id="packBar" style="width:80%"></i></div>
      </div>
      <div style="text-align:right">
        <div class="range"><span id="rangeKm">60.3</span> km</div>
        <div class="mono">Autonomia est.</div>
      </div>
    </div>

    <div class="card" style="padding-bottom:8px">
      <div class="row">
        <div class="label">Celle</div>
        <div class="mono" id="cellAlert">OK</div>
      </div>
      <div class="cells" id="cells" style="margin-top:8px"></div>
    </div>

    <div class="card" style="padding-bottom:8px;margin-bottom:96px">
      <div class="shortcuts">
        <a class="shortcut" href="tel:+390000000000"><div class="ic">📞</div><div class="tx">CALL</div></a>
        <a class="shortcut" href="https://maps.google.com" target="_blank" rel="noopener"><div class="ic">📍</div><div class="tx">MAPS</div></a>
        <a class="shortcut" href="https://open.spotify.com" target="_blank" rel="noopener"><div class="ic">🎵</div><div class="tx">SPOT</div></a>
        <button class="primary" id="connectBtn"><div class="ic">🔌</div><div class="tx">BMS</div></button>
        <button id="histBtn"><div class="ic">🕘</div><div class="tx">HIST</div></button>
        <button id="gpsQuickBtn"><div class="ic">📡</div><div class="tx">GPS</div></button>
      </div>
    </div>

    <div class="footer">
      <div class="status" id="status">Pronto</div>
      <div class="row">
        <button class="primary" id="saveTripBtn" style="min-width:92px">SALVA</button>
        <button id="clearTripBtn" style="min-width:92px">RESET</button>
      </div>
    </div>
  </div>
</div>

<div id="overlayRoot"></div>
<div class="toastWrap" id="toastWrap"></div>

<script>
const $=s=>document.querySelector(s), store={k:'ebikeDashboardV1'};
let state={
  speed:0,distance:0,odo:0,tripStart:Date.now(),lastPos:null,
  wake:null,gpsWatch:null,gpsOn:false,proto:'AUTO',soc:80,
  cells:Array.from({length:14},()=>3.96+Math.random()*0.08),
  history:JSON.parse(localStorage.getItem(store.k)||'[]')
};

function toast(msg){
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=msg;
  $('#toastWrap').appendChild(el);
  setTimeout(()=>el.remove(),2200);
}

function tick(){
  const d=new Date();
  $('#clock').textContent=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('#date').textContent=d.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
}
setInterval(tick,1000); tick();

function arcForSpeed(v){
  const p=Math.max(0,Math.min(1,v/50));
  const len=2*Math.PI*118*0.5;
  $('#arc').setAttribute('stroke-dasharray',`${len*p} ${999}`);
  $('#needle').setAttribute('transform',`translate(160 170) rotate(${-110+(220*p)})`);
}

function hav(a,b){
  const R=6371,e=x=>x*Math.PI/180,
  dLat=e(b.lat-a.lat),dLon=e(b.lon-a.lon),
  lat1=e(a.lat),lat2=e(b.lat),
  h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function startGps(){
  if(!navigator.geolocation){toast('GPS non supportato');return}
  if(state.gpsOn) return;
  state.gpsOn=true;
  $('#gpsBtn').textContent='GPS ON';
  $('#gpsQuickBtn').style.borderColor='var(--green)';
  $('#status').textContent='GPS attivo';
  state.gpsWatch=navigator.geolocation.watchPosition(p=>{
    const c=p.coords,cur={lat:c.latitude,lon:c.longitude};
    if(state.lastPos) state.distance+=hav(state.lastPos,cur);
    state.lastPos=cur;
    state.speed=c.speed!=null&&c.speed>=0?c.speed*3.6:state.speed;
    state.odo+=state.speed/3600/10;
    $('#speed').textContent=state.speed.toFixed(1);
    $('#distance').textContent=state.distance.toFixed(2);
    $('#odo').textContent=state.odo.toFixed(2);
    arcForSpeed(state.speed);
    $('#status').textContent='GPS aggiornato';
  },e=>{
    toast('GPS non disponibile: '+e.message);
    $('#status').textContent='GPS bloccato';
  },{enableHighAccuracy:true,maximumAge:1000,timeout:10000});
}

function stopGps(){
  if(!state.gpsOn) return;
  navigator.geolocation.clearWatch(state.gpsWatch);
  state.gpsWatch=null;
  state.gpsOn=false;
  $('#gpsBtn').textContent='GPS';
  $('#gpsQuickBtn').style.borderColor='var(--line)';
  $('#status').textContent='GPS spento';
}

$('#gpsBtn').onclick=()=>state.gpsOn?stopGps():startGps();
$('#gpsQuickBtn').onclick=()=>state.gpsOn?stopGps():startGps();

function tripMinutes(){
  return Math.max(0,Math.floor((Date.now()-state.tripStart)/60000));
}

setInterval(()=>{
  $('#avgSpeed').textContent=state.distance>0?(state.distance/(tripMinutes()/60||1)).toFixed(1):'0.0';
  $('#rangeKm').textContent=Math.max(0,(state.soc*0.75)).toFixed(1);
  $('#soc').textContent=state.soc.toFixed(0);
  $('#packBar').style.width=state.soc+'%';
  $('#packInfo').textContent='16.1 / 20 Ah';
  renderCells();
},1000);

function renderCells(){
  const vals=state.cells,spread=Math.max(...vals)-Math.min(...vals);
  $('#cellAlert').textContent=spread>0.08?`SBILANCIAMENTO ${spread.toFixed(2)}V`:'OK';
  $('#cellAlert').style.color=spread>0.08?'var(--danger)':'var(--ok)';
  $('#cells').innerHTML='';
  vals.forEach((v,i)=>{
    const p=Math.max(0,Math.min(1,(v-3.0)/1.2));
    const el=document.createElement('div');
    el.className='cell';
    el.innerHTML=`<div class='n'>C${i+1}</div><div class='mv'>${v.toFixed(3)}V</div><div class='miniBar'><i style='width:${p*100}%'></i></div>`;
    $('#cells').appendChild(el);
  });
}

function openHistory(){
  const old=document.getElementById('overlayRoot');
  old.innerHTML='';
  const back=document.createElement('div');
  back.className='backdrop';
  back.onclick=closeHistory;
  const modal=document.createElement('div');
  modal.className='historyPanel';
  let html='<div class="row"><div class="label">Storico</div><button id="closeHistoryBtn">CHIUDI</button></div><div class="mono" style="margin-top:6px">';
  html+=`${state.history.length} viaggi · ${state.history.reduce((a,b)=>a+b.km,0).toFixed(1)} km`;
  html+='</div><div style="display:grid;gap:6px;margin-top:8px">';
  state.history.forEach(h=>{
    html+=`<div class="card soft" style="padding:8px"><div class="mono">${new Date(h.date).toLocaleString('it-IT')}</div><div class="mono">${h.km.toFixed(2)} km · ${Math.floor(h.time/60)}:${String(h.time%60).padStart(2,'0')} · ${h.avg.toFixed(1)} km/h</div><div style="margin-top:6px;display:flex;gap:6px"><button data-del="${h.id}">ELIMINA</button></div></div>`;
  });
  html+='</div>';
  modal.innerHTML=html;
  old.appendChild(back);
  old.appendChild(modal);
  $('#closeHistoryBtn').onclick=closeHistory;
  modal.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    state.history=state.history.filter(x=>x.id!=b.dataset.del);
    localStorage.setItem(store.k,JSON.stringify(state.history));
    openHistory();
    toast('Viaggio eliminato');
  });
}

function closeHistory(){
  document.getElementById('overlayRoot').innerHTML='';
}

function saveHist(){
  const item={
    id:Date.now(),
    date:new Date().toISOString(),
    km:+state.distance.toFixed(2),
    time:tripMinutes(),
    avg:+($('#avgSpeed').textContent||0),
    odo:+state.odo.toFixed(2)
  };
  state.history.unshift(item);
  localStorage.setItem(store.k,JSON.stringify(state.history));
  toast('Viaggio salvato');
}

async function startBluetooth(){
  const status=$('#status');
  status.textContent='Bluetooth: richiesta permesso...';
  try{
    if(!navigator.bluetooth){
      status.textContent='Bluetooth non supportato';
      toast('Bluetooth non supportato');
      return;
    }
    const device=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:['battery_service','device_information','generic_access','generic_attribute']
    });
    state.proto=device.name||'BLE';
    $('#protoTop').textContent='BT';
    status.textContent='Trovato: '+(device.name||'dispositivo BLE');
    toast('Trovato: '+(device.name||'dispositivo BLE'));
    try{
      const server=await device.gatt.connect();
      let battery=null;
      try{
        const svc=await server.getPrimaryService('battery_service');
        const ch=await svc.getCharacteristic('battery_level');
        const val=await ch.readValue();
        battery=val.getUint8(0);
        state.soc=battery;
        $('#packInfo').textContent='BMS reale · Battery Service';
        $('#packBar').style.width=state.soc+'%';
      }catch(e){}
      status.textContent=battery!=null
        ? ('Connesso: '+(device.name||'BLE')+' · Batteria '+battery+'%')
        : ('Connesso a '+(device.name||'BLE')+' (lettura limitata)');
    }catch(e){
      toast('Connessione non riuscita');
    }
  }catch(e){
    status.textContent='Bluetooth annullato';
    toast('Bluetooth annullato');
  }
}

$('#saveTripBtn').onclick=saveHist;
$('#histBtn').onclick=openHistory;
$('#clearTripBtn').onclick=()=>{
  state.distance=0;
  state.odo=0;
  state.tripStart=Date.now();
  state.lastPos=null;
  toast('Viaggio resettato');
};
$('#wakeBtn').onclick=async()=>{
  try{
    if('wakeLock'in navigator){
      state.wake?await state.wake.release():state.wake=await navigator.wakeLock.request('screen');
      toast('Wake lock attivo');
    }else toast('Wake lock non supportato');
  }catch(e){
    toast('Wake lock non disponibile');
  }
};
$('#connectBtn').onclick=(e)=>{e.preventDefault();e.stopPropagation();startBluetooth();};

renderCells();
arcForSpeed(0);
$('#protoTop').textContent='A';
</script>
</body>
</html>
