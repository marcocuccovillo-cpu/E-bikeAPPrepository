<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f67c7" />
<title>E-BIKE Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf3fb; --panel:#fff; --text:#17223a; --muted:#72809a; --line:#d8e2ee;
  --blue:#0f67c7; --green:#28a745; --yellow:#f0b429; --red:#ef5350;
  --shadow:0 10px 24px rgba(16,26,44,.12); --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:Rajdhani,system-ui,sans-serif;color:var(--text);overflow:hidden}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#f5f8fe 0%,#e9eff8 100%);z-index:0}
.main{flex:1;min-height:0;overflow:auto;padding:14px 14px 132px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;z-index:1}
.hero{min-height:194px;display:grid;place-items:center;padding:10px;position:relative}
.gpsbars{position:absolute;left:14px;top:14px;display:grid;gap:4px;z-index:1;pointer-events:none}
.gpsbar{width:24px;height:4px;border-radius:999px;background:#dfe6ef;overflow:hidden}
.gpsbar i{display:block;height:100%;width:100%;background:transparent;border-radius:inherit}
.gpsbar.on1 i{background:var(--red)}
.gpsbar.on2 i{background:var(--yellow)}
.gpsbar.on3 i{background:#71d04d}
.gpsbar.on4 i{background:#2aa84f}
.gauge{width:min(100%,320px);position:relative;z-index:1;pointer-events:none}
.speed{font:700 42px/1 Barlow Condensed,sans-serif;margin-top:-4px;position:relative;z-index:1}
.unit{font-size:14px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{padding:12px 12px 11px;min-height:74px}
.label{font:700 11px/1 Barlow Condensed,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.value{font:700 22px/1 Barlow Condensed,sans-serif;margin-top:4px}
.mono{font-family:'Share Tech Mono',monospace;font-size:11px}
.weather{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;min-height:64px}
.weather .temp{font:700 22px/1 Barlow Condensed,sans-serif}
.weatherName{font:700 12px/1 Barlow Condensed,sans-serif;letter-spacing:1px;color:var(--muted)}
.trip{padding:12px 14px;min-height:88px}
.tripGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.battery{padding:12px 14px}
.batteryGrid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.range{font:700 32px/1 Barlow Condensed,sans-serif;color:var(--blue);text-align:right}
.bar{height:8px;background:#d5dfeb;border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#74d04b)}
.shortcuts{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:12px 14px;position:relative;z-index:10;pointer-events:auto}
.shortcut,.btn{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;pointer-events:auto}
.shortcut{min-height:56px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;text-decoration:none;color:var(--text);position:relative;z-index:11}
.shortcut .ic{font-size:20px}
.shortcut .tx{font:700 10px/1 Barlow Condensed,sans-serif;letter-spacing:.8px}
.cellsCard{padding:12px 14px}
.cellsTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cells{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{padding:6px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#f7fbff)}
.cell .n{font:700 10px/1 Barlow Condensed,sans-serif;color:var(--muted)}
.cell .mv{font:700 11px/1 'Share Tech Mono',monospace;margin-top:4px}
.miniBar{height:6px;background:#d6dfeb;border-radius:999px;overflow:hidden;margin-top:5px}
.miniBar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--yellow),var(--green))}
.footer{position:sticky;bottom:0;z-index:30;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(238,243,251,.05),rgba(238,243,251,.92) 18%, rgba(238,243,251,1) 100%);box-shadow:0 -8px 20px rgba(18,28,45,.08);pointer-events:auto}
.status{font:700 11px/1 'Share Tech Mono',monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
.btn{border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:var(--shadow);color:var(--text);padding:12px 16px;min-width:92px;font:700 10px/1 Barlow Condensed,sans-serif;letter-spacing:.8px;position:relative;z-index:11}
.btn.primary{background:linear-gradient(180deg,#2e7eea,#0f67c7);color:#fff;border-color:transparent}
.btn.danger{background:#fff;color:#b00020;border-color:#f0c7d0}
.overlay{position:fixed;inset:0;background:rgba(14,20,32,.3);z-index:50;pointer-events:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,92vw);max-height:78vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.25);z-index:60;padding:12px;pointer-events:auto}
.toastWrap{position:fixed;right:8px;bottom:8px;display:grid;gap:6px;z-index:9999;pointer-events:none}
.toast{background:rgba(18,25,40,.95);color:#fff;padding:10px 12px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:min(340px,90vw)}
.wakeOn{background:linear-gradient(180deg,#27b35b,#1e8f47)!important;color:#fff!important;border-color:transparent!important}
.codeBox{font-family:'Share Tech Mono',monospace;font-size:10px;line-height:1.4;white-space:pre-wrap;background:#f7fbff;border:1px solid var(--line);border-radius:12px;padding:8px}
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <section class="hero card">
      <div class="gpsbars" id="gpsbars">
        <div class="gpsbar"><i></i></div>
        <div class="gpsbar"><i></i></div>
        <div class="gpsbar"><i></i></div>
        <div class="gpsbar"><i></i></div>
      </div>
      <svg class="gauge" viewBox="0 0 320 220">
        <defs>
          <linearGradient id="g1" x1="0" x2="1">
            <stop offset="0%" stop-color="#ff6d6d"/>
            <stop offset="55%" stop-color="#ffd166"/>
            <stop offset="100%" stop-color="#2aa84f"/>
          </linearGradient>
        </defs>
        <path d="M42 170 A118 118 0 0 1 278 170" fill="none" stroke="#cfd8e4" stroke-width="20" stroke-linecap="round"/>
        <path id="arc" d="M42 170 A118 118 0 0 1 278 170" fill="none" stroke="url(#g1)" stroke-width="20" stroke-linecap="round" stroke-dasharray="0 999"/>
        <g id="needle" transform="translate(160 170)">
          <line x1="0" y1="0" x2="0" y2="-92" stroke="#1d2430" stroke-width="4" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="8" fill="#1d2430"/>
        </g>
        <text x="160" y="188" text-anchor="middle" class="mono" fill="#687689">KM/H</text>
      </svg>
      <div class="speed"><span id="speed">0.0</span><span class="unit"> km/h</span></div>
    </section>
        <section class="grid2">
      <div class="card metric">
        <div class="label">LUMI / OGGI</div>
        <div class="value" id="clock">--:--:--</div>
        <div class="mono" id="date">--</div>
      </div>
      <div class="card metric">
        <div class="label">DISTANZA</div>
        <div class="value"><span id="distance">0.00</span> km</div>
        <div class="mono">GPS</div>
      </div>
    </section>

    <section class="card weather">
      <div style="font-size:24px">⛅</div>
      <div>
        <div class="weatherName" id="weatherPlace">—</div>
        <div class="temp"><span id="temp">—</span> °C</div>
      </div>
      <div style="text-align:right">
        <div class="mono" id="weatherWind">—</div>
        <div class="mono" id="weatherHum">—</div>
      </div>
    </section>

    <section class="card trip">
      <div class="label">Trip</div>
      <div class="tripGrid" style="margin-top:8px">
        <div>
          <div class="label">ODO</div>
          <div class="value"><span id="odo">0.00</span> km</div>
        </div>
        <div style="text-align:right">
          <div class="label">V. media</div>
          <div class="value"><span id="avgSpeed">0.0</span> km/h</div>
        </div>
      </div>
    </section>

    <section class="card battery">
      <div class="label">Batteria</div>
      <div class="batteryGrid" style="margin-top:8px">
        <div>
          <div id="socBox" class="nullBox"><span id="soc">—</span></div>
          <div class="mono" id="packInfo">—</div>
          <div class="bar"><i id="packBar" style="width:0%"></i></div>
        </div>
        <div style="text-align:right">
          <div class="range"><span id="rangeKm">—</span> km</div>
          <div class="mono">Autonomia est.</div>
        </div>
      </div>
      <div class="mono" id="bmsHint" style="margin-top:8px">Premi BMS per avviare la lettura BLE.</div>
    </section>

    <section class="card shortcutsCard">
      <div class="shortcuts">
        <button class="shortcut" id="connectBtn2" type="button"><div class="ic">🔌</div><div class="tx">BMS</div></button>
        <button class="shortcut" id="histBtn" type="button"><div class="ic">🕘</div><div class="tx">HISTORY</div></button>
        <button class="shortcut" id="gpsQuickBtn" type="button"><div class="ic">📡</div><div class="tx">GPS</div></button>
        <a class="shortcut" href="tel:+390000000000"><div class="ic">📞</div><div class="tx">CALL</div></a>
        <a class="shortcut" href="https://maps.google.com" target="_blank" rel="noopener"><div class="ic">📍</div><div class="tx">MAPS</div></a>
        <a class="shortcut" href="https://open.spotify.com" target="_blank" rel="noopener"><div class="ic">🎵</div><div class="tx">SPOT</div></a>
      </div>
    </section>

    <section class="card">
      <div class="label">LOG BLE</div>
      <div class="codeBox" id="bleLog">Pronto.</div>
    </section>

    <section class="card cellsCard">
      <div class="cellsTop">
        <div class="label">Celle</div>
        <div class="mono" id="cellAlert">—</div>
      </div>
      <div class="cells" id="cells"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="status" id="status">Pronto</div>
    <div class="actions">
      <button class="btn primary" id="saveTripBtn" type="button">SALVA</button>
      <button class="btn danger" id="clearTripBtn" type="button">RESET</button>
      <button class="btn" id="wakeBtn" type="button">SCHERMO</button>
    </div>
  </footer>
</div>
<div id="overlayRoot"></div>
<div class="toastWrap" id="toastWrap"></div>
  <script>
const $=s=>document.querySelector(s);
const store={k:'ebikeAndroidDash_fixed'};
let state={speed:0,distance:0,tripStart:Date.now(),lastPos:null,wake:null,gpsWatch:null,gpsOn:false,history:JSON.parse(localStorage.getItem(store.k)||'[]'),bmsDevice:null};

function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;$('#toastWrap').appendChild(e);setTimeout(()=>e.remove(),2200)}
function setStatus(t){$('#status').textContent=t;$('#bleLog').textContent=($('#bleLog').textContent==='Pronto.'?'':$('#bleLog').textContent+'
')+t}
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('#date').textContent=d.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}
setInterval(tick,1000);tick();

function arcForSpeed(v){const p=Math.max(0,Math.min(1,v/50));const len=2*Math.PI*118*0.5;$('#arc').setAttribute('stroke-dasharray',`${len*p} 999`);$('#needle').setAttribute('transform',`translate(160 170) rotate(${-110+(220*p)})`)}
function H(a,b){const R=6371,e=x=>x*Math.PI/180;const dLat=e(b.lat-a.lat),dLon=e(b.lon-a.lon),lat1=e(a.lat),lat2=e(b.lat);const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function bindTap(sel,fn){const el=$(sel);if(!el)return;let lock=false;const run=e=>{if(lock)return;lock=true;setTimeout(()=>lock=false,350);e.preventDefault();e.stopPropagation();fn(e)};el.addEventListener('pointerup',run,{passive:false});el.addEventListener('touchend',run,{passive:false});el.addEventListener('click',run,{passive:false})}

function setGpsBars(acc){const bars=[15,8,5,3];$('#gpsbars').querySelectorAll('.gpsbar').forEach((el,i)=>{el.className='gpsbar';if(acc==null)return;if(acc<=bars[i])el.classList.add('on'+(i+1))})}
async function reversePlace(lat,lon){try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=it&format=json`);const j=await r.json();const p=j.results?.[0];return p?[p.name,p.admin1,p.country].filter(Boolean).join(', '):`GPS ${lat.toFixed(4)}, ${lon.toFixed(4)}`}catch{return `GPS ${lat.toFixed(4)}, ${lon.toFixed(4)}`}}
async function updateWeather(lat,lon){try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=auto`);const j=await r.json();const c=j.current||{};$('#weatherPlace').textContent=await reversePlace(lat,lon);$('#temp').textContent=c.temperature_2m==null?'—':Number(c.temperature_2m).toFixed(1);$('#weatherHum').textContent=c.relative_humidity_2m==null?'—':`Umidità ${Math.round(c.relative_humidity_2m)}%`;$('#weatherWind').textContent=c.wind_speed_10m==null?'—':`Vento ${Number(c.wind_speed_10m).toFixed(1)} km/h`;setStatus('Meteo aggiornato')}catch{setStatus('Meteo non disponibile')}}

function renderBatteryNull(reason){$('#soc').textContent='—';$('#rangeKm').textContent='—';$('#packInfo').textContent=reason||'—';$('#packBar').style.width='0%';$('#cellAlert').textContent='—';$('#cells').innerHTML='';for(let i=0;i<14;i++){const el=document.createElement('div');el.className='cell';el.innerHTML=`<div class='n'>C${i+1}</div><div class='mv'>—</div><div class='miniBar'><i style='width:0%'></i></div>`;$('#cells').appendChild(el)}}
function drawCells(values){$('#cells').innerHTML='';values.forEach((v,i)=>{const el=document.createElement('div');el.className='cell';el.innerHTML=`<div class='n'>C${i+1}</div><div class='mv'>${typeof v==='number'?v.toFixed(3):'—'}</div><div class='miniBar'><i style='width:${typeof v==='number'?Math.max(0,Math.min(100,((v-3)/(4.25-3))*100)):0}%'></i></div>`;$('#cells').appendChild(el)})}
function parsePayload(view){const b=[];for(let i=0;i<view.byteLength;i++)b.push(view.getUint8(i));let soc=b.find(x=>x>=0&&x<=100);return{soc:typeof soc==='number'?soc:null,cells:b.slice(0,14).map(x=>x>0&&x<1000?x/100:null),raw:b}}

async function connectBms(){setStatus('BMS: tap');try{if(!navigator.bluetooth){toast('Bluetooth non supportato');return}const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['battery_service','0000180f-0000-1000-8000-00805f9b34fb','0000fff0-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','6e400001-b5a3-f393-e0a9-e50e24dcca9e']});state.bmsDevice=device;setStatus(`Connessione ${device.name||'BLE'}...`);const server=await device.gatt.connect();try{const svc=await server.getPrimaryService('battery_service');const ch=await svc.getCharacteristic('battery_level');const v=await ch.readValue();const soc=v.getUint8(0);$('#soc').textContent=soc;$('#packInfo').textContent='Battery Service';$('#packBar').style.width=soc+'%';$('#rangeKm').textContent=(soc*0.5).toFixed(1);$('#bmsHint').textContent='Battery Service trovato';setStatus('BMS letto')}catch{setStatus('Nessun Battery Service');$('#bmsHint').textContent='Nessun dato battery_service';renderBatteryNull('nessun dato')}}catch(e){setStatus('BMS annullato o bloccato');toast('Bluetooth bloccato/annullato')}}

function startGps(){if(!navigator.geolocation){toast('GPS non supportato');return}if(state.gpsOn)return;state.gpsOn=true;setStatus('GPS attivo');$('#gpsQuickBtn').style.borderColor='var(--green)';state.gpsWatch=navigator.geolocation.watchPosition(async p=>{const c=p.coords;const cur={lat:c.latitude,lon:c.longitude};if(state.lastPos)state.distance+=H(state.lastPos,cur);state.lastPos=cur;if(c.speed!=null&&c.speed>=0)state.speed=c.speed*3.6;$('#speed').textContent=state.speed.toFixed(1);$('#distance').textContent=state.distance.toFixed(2);$('#odo').textContent=state.distance.toFixed(2);$('#avgSpeed').textContent=state.distance>0?((state.distance)/(Math.max(1,(Date.now()-state.tripStart)/3600000))).toFixed(1):'0.0';arcForSpeed(state.speed);await updateWeather(c.latitude,c.longitude)},e=>{setStatus('GPS bloccato: '+e.message);toast('GPS non disponibile');state.gpsOn=false;$('#gpsQuickBtn').style.borderColor='var(--line)'} ,{enableHighAccuracy:true,maximumAge:1000,timeout:12000})}
function stopGps(){if(!state.gpsOn)return;navigator.geolocation.clearWatch(state.gpsWatch);state.gpsOn=false;$('#gpsQuickBtn').style.borderColor='var(--line)';setStatus('GPS spento')}

function saveHist(){state.history.unshift({id:Date.now(),date:new Date().toISOString(),km:+state.distance.toFixed(2),avg:+($('#avgSpeed').textContent||0)});localStorage.setItem(store.k,JSON.stringify(state.history));toast('Salvato')}
function openHistory(){const root=$('#overlayRoot');root.innerHTML='';const o=document.createElement('div');o.className='overlay';o.onclick=()=>root.innerHTML='';const m=document.createElement('div');m.className='modal';m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div class="label">Storico</div><button class="btn" id="closeH" type="button">CHIUDI</button></div><div style="margin-top:8px" class="mono">${state.history.length} viaggi</div><div id="histList" style="display:grid;gap:6px;margin-top:8px"></div>`;root.appendChild(o);root.appendChild(m);$('#closeH').onclick=()=>root.innerHTML='';const list=$('#histList');state.history.forEach(h=>{const d=document.createElement('div');d.className='card';d.style.padding='8px';d.innerHTML=`<div class="mono">${new Date(h.date).toLocaleString('it-IT')}</div><div class="mono">${h.km.toFixed(2)} km · ${h.avg.toFixed(1)} km/h</div>`;list.appendChild(d)})}
function keepScreenOn(){if(!('wakeLock' in navigator)){toast('Wake Lock non supportato');return}if(state.wake){state.wake.release();state.wake=null;$('#wakeBtn').classList.remove('wakeOn');setStatus('Schermo normale')}else{navigator.wakeLock.request('screen').then(w=>{state.wake=w;$('#wakeBtn').classList.add('wakeOn');setStatus('Schermo acceso');w.addEventListener('release',()=>{$('#wakeBtn').classList.remove('wakeOn');state.wake=null})}).catch(()=>toast('Wake Lock non disponibile'))}}

bindTap('#connectBtn2',connectBms);
bindTap('#gpsQuickBtn',()=>state.gpsOn?stopGps():startGps());
bindTap('#histBtn',openHistory);
bindTap('#saveTripBtn',saveHist);
bindTap('#clearTripBtn',()=>{state.distance=0;state.tripStart=Date.now();state.lastPos=null;state.speed=0;$('#speed').textContent='0.0';$('#distance').textContent='0.00';$('#odo').textContent='0.00';$('#avgSpeed').textContent='0.0';arcForSpeed(0);toast('Reset')});
bindTap('#wakeBtn',keepScreenOn);

function start(){for(let i=0;i<14;i++){const el=document.createElement('div');el.className='cell';el.innerHTML=`<div class='n'>C${i+1}</div><div class='mv'>—</div><div class='miniBar'><i style='width:0%'></i></div>`;$('#cells').appendChild(el)}arcForSpeed(0);renderBatteryNull('premi BMS');setStatus('Pronto')}
start();
</script>
</body>
</html>
