<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d67c5" />
<title>E-BIKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fb;--panel:#fff;--panel2:#f8fbff;--text:#152033;--muted:#6f7d91;--blue:#0d67c5;--blue2:#176fca;--green:#2aa84f;--line:#d7e1ec;--shadow:0 10px 22px rgba(18,28,45,.12);--ok:#21a455;--warn:#f0b429;--danger:#ef5350}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:Rajdhani,system-ui,sans-serif;color:var(--text)}
body{overflow:hidden;touch-action:manipulation}
.page{position:fixed;inset:0;width:100vw;height:100dvh;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.topbar{flex:0 0 auto;height:66px;background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:var(--shadow);border-bottom-left-radius:20px;border-bottom-right-radius:20px}
.brand{display:flex;align-items:center;gap:8px;font:700 18px/1 Barlow Condensed,sans-serif;letter-spacing:2px}
.brand .bolt{font-size:18px}
.topright{display:flex;gap:8px;align-items:center}
.chip{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.content{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:10px 10px 116px;gap:8px;-webkit-overflow-scrolling:touch}
.hero{background:linear-gradient(180deg,#f9fbff,#edf3fb);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-height:190px;display:grid;place-items:center;padding:8px 10px 10px}
.gauge{width:100%;max-width:295px;height:auto}
.speed{font:700 42px/1 Barlow Condensed,sans-serif;margin-top:-4px}
.unit{font-size:15px;color:var(--muted)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px;min-height:0}
.card.soft{background:linear-gradient(180deg,var(--panel),var(--panel2))}
.label{font:700 11px/1 Barlow Condensed,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.value{font:700 23px/1 Barlow Condensed,sans-serif;margin-top:3px}
.mono{font-family:'Share Tech Mono',monospace;font-size:11px}
.weather{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.weather .temp{font:700 22px/1 Barlow Condensed,sans-serif}
.tripGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.batteryGrid{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.soc{font:700 40px/1 Barlow Condensed,sans-serif;color:var(--green)}
.range{font:700 34px/1 Barlow Condensed,sans-serif;color:var(--blue);text-align:right}
.bar{height:7px;background:#d5dfeb;border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#74d04b)}
.cells{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px}
.cell .n{font:700 10px/1 Barlow Condensed,sans-serif;color:var(--muted)}
.cell .mv{font:700 11px/1 'Share Tech Mono',monospace;margin-top:3px}
.miniBar{height:6px;background:#d6dfeb;border-radius:999px;overflow:hidden;margin-top:4px}
.miniBar i{display:block;height:100%;background:linear-gradient(90deg,var(--danger),var(--warn),var(--ok))}
.shortcuts{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.shortcut{min-height:52px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;text-decoration:none;color:var(--text)}
.shortcut .ic{font-size:20px}
.shortcut .tx{font:700 10px/1 Barlow Condensed,sans-serif;letter-spacing:.8px}
.footer{flex:0 0 auto;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px calc(10px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:linear-gradient(180deg,rgba(238,243,251,.05),rgba(238,243,251,.92) 22%, rgba(238,243,251,1) 100%);z-index:20;box-shadow:0 -8px 20px rgba(18,28,45,.08)}
.status{font:700 11px/1 'Share Tech Mono',monospace;color:var(--muted)}
button{border:1px solid var(--line);background:var(--panel);border-radius:12px;box-shadow:var(--shadow);color:var(--text);padding:8px 10px;font:700 12px/1 Barlow Condensed,sans-serif}
button.primary{background:linear-gradient(180deg,#2e7eea,#0d67c5);color:#fff;border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.historyPanel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(390px,92vw);max-height:70vh;overflow:auto;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.25);padding:12px}
.backdrop{position:fixed;inset:0;background:rgba(10,18,30,.25);z-index:40}
.toastWrap{position:fixed;right:8px;bottom:8px;display:grid;gap:6px;z-index:9999}
.toast{background:rgba(18,25,40,.95);color:#fff;padding:10px 12px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:min(340px,90vw)}
.null{color:#98a3b7}
.nullBox{min-height:44px;display:flex;align-items:center;justify-content:center;color:#98a3b7;border:1px dashed #d5dfeb;border-radius:12px;background:#fafcff}
.weatherName{font:700 12px/1 Barlow Condensed,sans-serif;letter-spacing:1px;color:var(--muted)}
@media (max-height:780px){
  .content{padding:8px 10px 116px;gap:7px}
  .hero{min-height:178px}
  .value{font-size:21px}
  .soc{font-size:38px}
  .range{font-size:31px}
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand"><span class="bolt">⚡</span><span>E-BIKE</span></div>
    <div class="topright"><span class="chip" id="protoTop">A</span><button id="gpsBtn">GPS</button><button id="connectBtn">BMS</button></div>
  </div>

  <div class="content">
    <div class="hero">
      <svg class="gauge" viewBox="0 0 320 220">
        <defs>
          <linearGradient id="g1" x1="0" x2="1">
            <stop offset="0%" stop-color="#ff6d6d"/>
            <stop offset="55%" stop-color="#ffd166"/>
            <stop offset="100%" stop-color="#2aa84f"/>
          </linearGradient>
        </defs>
        <path d="M42 170 A118 118 0 0 1 278 170" fill="none" stroke="#cfd8e4" stroke-width="20" stroke-linecap="round"/>
        <path id="arc" d="M42 170 A118 118 0 0 1 278 170" fill="none" stroke="url(#g1)" stroke-width="20" stroke-linecap="round" stroke-dasharray="0 999"/>
        <g id="needle" transform="translate(160 170)">
          <line x1="0" y1="0" x2="0" y2="-92" stroke="#1d2430" stroke-width="4" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="8" fill="#1d2430"/>
        </g>
        <text x="160" y="188" text-anchor="middle" class="mono" fill="#687689">KM/H</text>
      </svg>
      <div class="speed"><span id="speed">0.0</span><span class="unit"> km/h</span></div>
    </div>

    <div class="pairs">
      <div class="card">
        <div class="label">LUMI / OGGI</div>
        <div class="value" id="clock">--:--:--</div>
        <div class="mono" id="date">--</div>
      </div>
      <div class="card">
        <div class="label">DISTANZA</div>
        <div class="value"><span id="distance">0.00</span> km</div>
        <div class="mono">GPS</div>
      </div>
    </div>

    <div class="card soft weather">
      <div style="font-size:24px">⛅</div>
      <div>
        <div class="weatherName" id="weatherPlace">—</div>
        <div class="temp"><span id="temp" class="null">—</span> °C</div>
      </div>
      <div style="text-align:right">
        <div class="mono" id="weatherWind">—</div>
        <div class="mono" id="weatherHum">—</div>
      </div>
    </div>

    <div class="card soft">
      <div class="label">Trip</div>
      <div class="tripGrid" style="margin-top:6px">
        <div>
          <div class="label">ODO</div>
          <div class="value"><span id="odo">0.00</span> km</div>
        </div>
        <div style="text-align:right">
          <div class="label">V. media</div>
          <div class="value"><span id="avgSpeed">0.0</span> km/h</div>
        </div>
      </div>
    </div>

    <div class="card soft batteryGrid">
      <div>
        <div class="label">Batteria</div>
        <div id="socBox" class="nullBox"><span id="soc" class="null">—</span></div>
        <div class="mono" id="packInfo">—</div>
        <div class="bar"><i id="packBar" style="width:0%"></i></div>
      </div>
      <div style="text-align:right">
        <div class="range"><span id="rangeKm" class="null">—</span> km</div>
        <div class="mono">Autonomia est.</div>
      </div>
    </div>

    <div class="card" style="padding-bottom:8px">
      <div class="row">
        <div class="label">Celle</div>
        <div class="mono" id="cellAlert">—</div>
      </div>
      <div class="cells" id="cells" style="margin-top:8px"></div>
    </div>

    <div class="card" style="padding-bottom:8px;margin-bottom:96px">
      <div class="shortcuts">
        <a class="shortcut" href="tel:+390000000000"><div class="ic">📞</div><div class="tx">CALL</div></a>
        <a class="shortcut" href="https://maps.google.com" target="_blank" rel="noopener"><div class="ic">📍</div><div class="tx">MAPS</div></a>
        <a class="shortcut" href="https://open.spotify.com" target="_blank" rel="noopener"><div class="ic">🎵</div><div class="tx">SPOT</div></a>
        <button class="primary" id="connectBtn"><div class="ic">🔌</div><div class="tx">BMS</div></button>
        <button id="histBtn"><div class="ic">🕘</div><div class="tx">HIST</div></button>
        <button id="gpsQuickBtn"><div class="ic">📡</div><div class="tx">GPS</div></button>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="status" id="status">Pronto</div>
    <div class="row">
      <button class="primary" id="saveTripBtn" style="min-width:92px">SALVA</button>
      <button id="clearTripBtn" style="min-width:92px">RESET</button>
    </div>
  </div>
</div>

<div id="overlayRoot"></div>
<div class="toastWrap" id="toastWrap"></div>

<script>
const $=s=>document.querySelector(s), store={k:'ebikeDashboardV1'};
let state={
  speed:0,distance:0,odo:0,tripStart:Date.now(),lastPos:null,
  wake:null,gpsWatch:null,gpsOn:false,proto:'AUTO',soc:null,
  cells:[],history:JSON.parse(localStorage.getItem(store.k)||'[]'),
  weather:null,bmsDevice:null
};

function toast(msg){
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=msg;
  $('#toastWrap').appendChild(el);
  setTimeout(()=>el.remove(),2500);
}

function tick(){
  const d=new Date();
  $('#clock').textContent=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('#date').textContent=d.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
}
setInterval(tick,1000); tick();

function arcForSpeed(v){
  const p=Math.max(0,Math.min(1,v/50));
  const len=2*Math.PI*118*0.5;
  $('#arc').setAttribute('stroke-dasharray',`${len*p} ${999}`);
  $('#needle').setAttribute('transform',`translate(160 170) rotate(${-110+(220*p)})`);
}

function hav(a,b){
  const R=6371,e=x=>x*Math.PI/180,dLat=e(b.lat-a.lat),dLon=e(b.lon-a.lon),lat1=e(a.lat),lat2=e(b.lat),h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

async function updateWeather(lat,lon){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m&timezone=auto`;
    const r=await fetch(u);
    if(!r.ok) throw new Error('weather');
    const j=await r.json();
    const c=j.current||{};
    state.weather={temp:c.temperature_2m??null,hum:c.relative_humidity_2m??null,wind:c.wind_speed_10m??null,code:c.weather_code??null};
    $('#weatherPlace').textContent=`GPS ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
    $('#temp').textContent=state.weather.temp==null?'—':Number(state.weather.temp).toFixed(1);
    $('#weatherHum').textContent=state.weather.hum==null?'Umidità —':`Umidità ${state.weather.hum}%`;
    $('#weatherWind').textContent=state.weather.wind==null?'Vento —':`Vento ${Number(state.weather.wind).toFixed(1)} km/h`;
  }catch(e){
    state.weather=null;
    $('#weatherPlace').textContent='—';
    $('#temp').textContent='—';
    $('#weatherHum').textContent='—';
    $('#weatherWind').textContent='—';
  }
}

function startGps(){
  if(!navigator.geolocation){toast('GPS non supportato');$('#status').textContent='GPS non supportato';return}
  if(state.gpsOn) return;
  state.gpsOn=true;
  $('#gpsBtn').textContent='GPS ON';
  $('#gpsQuickBtn').style.borderColor='var(--green)';
  $('#status').textContent='GPS attivo';
  state.gpsWatch=navigator.geolocation.watchPosition(async p=>{
    const c=p.coords,cur={lat:c.latitude,lon:c.longitude};
    if(state.lastPos) state.distance+=hav(state.lastPos,cur);
    state.lastPos=cur;
    if(c.speed!=null&&c.speed>=0) state.speed=c.speed*3.6;
    $('#speed').textContent=state.speed.toFixed(1);
    $('#distance').textContent=state.distance.toFixed(2);
    $('#odo').textContent=state.distance.toFixed(2);
    $('#avgSpeed').textContent=state.distance>0?((state.distance)/(Math.max(1,(Date.now()-state.tripStart)/3600000))).toFixed(1):'0.0';
    arcForSpeed(state.speed);
    $('#status').textContent='GPS aggiornato';
    await updateWeather(c.latitude,c.longitude);
  },e=>{
    toast('GPS non disponibile: '+e.message);
    $('#status').textContent='GPS bloccato; abilita posizione nel browser';
    $('#gpsBtn').textContent='GPS';
    $('#gpsQuickBtn').style.borderColor='var(--line)';
    state.gpsOn=false;
  },{enableHighAccuracy:true,maximumAge:1000,timeout:12000});
}

function stopGps(){
  if(!state.gpsOn) return;
  navigator.geolocation.clearWatch(state.gpsWatch);
  state.gpsWatch=null;
  state.gpsOn=false;
  $('#gpsBtn').textContent='GPS';
  $('#gpsQuickBtn').style.borderColor='var(--line)';
  $('#status').textContent='GPS spento';
}

$('#gpsBtn').onclick=()=>state.gpsOn?stopGps():startGps();
$('#gpsQuickBtn').onclick=()=>state.gpsOn?stopGps():startGps();

function renderBatteryNull(){
  state.soc=null;
  state.cells=[];
  $('#soc').textContent='—';
  $('#soc').classList.add('null');
  $('#rangeKm').textContent='—';
  $('#rangeKm').classList.add('null');
  $('#packInfo').textContent='—';
  $('#packInfo').classList.add('null');
  $('#packBar').style.width='0%';
  $('#cellAlert').textContent='—';
  $('#cells').innerHTML='';
  for(let i=0;i<14;i++){
    const el=document.createElement('div');
    el.className='cell';
    el.innerHTML=`<div class='n'>C${i+1}</div><div class='mv null'>—</div><div class='miniBar'><i style='width:0%'></i></div>`;
    $('#cells').appendChild(el);
  }
}

async function connectBms(){
  const status=$('#status');
  status.textContent='Bluetooth: richiesta permesso...';
  try{
    if(!navigator.bluetooth){
      status.textContent='Bluetooth non supportato';
      toast('Bluetooth non supportato');
      renderBatteryNull();
      return;
    }
    const device=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:['battery_service','device_information','generic_access','generic_attribute']
    });
    state.proto=device.name||'BLE';
    $('#protoTop').textContent='BT';
    status.textContent='Connesso al device scelto';
    toast('Device scelto: '+(device.name||'BLE'));
    state.bmsDevice=device;
    try{
      const server=await device.gatt.connect();
      let got=false;
      try{
        const svc=await server.getPrimaryService('battery_service');
        const ch=await svc.getCharacteristic('battery_level');
        const val=await ch.readValue();
        state.soc=val.getUint8(0);
        got=true;
        $('#packInfo').textContent='BMS reale · Battery Service';
        $('#packBar').style.width=state.soc+'%';
        $('#soc').textContent=String(state.soc);
      }catch(e){}
      status.textContent=got?('Connesso: '+(device.name||'BLE')+' · batteria letta'):('Connesso a '+(device.name||'BLE')+' (nessun dato batteria disponibile)');
    }catch(e){
      toast('Connessione non riuscita');
      status.textContent='Connessione non riuscita';
      renderBatteryNull();
    }
  }catch(e){
    status.textContent='Bluetooth annullato';
    toast('Bluetooth annullato');
    renderBatteryNull();
  }
}

function tripMinutes(){
  return Math.max(0,Math.floor((Date.now()-state.tripStart)/60000));
}

function openHistory(){
  const old=document.getElementById('overlayRoot');
  old.innerHTML='';
  const back=document.createElement('div');
  back.className='backdrop';
  back.onclick=closeHistory;
  const modal=document.createElement('div');
  modal.className='historyPanel';
  let html='<div class="row"><div class="label">Storico</div><button id="closeHistoryBtn">CHIUDI</button></div><div class="mono" style="margin-top:6px">';
  html+=`${state.history.length} viaggi · ${state.history.reduce((a,b)=>a+b.km,0).toFixed(1)} km`;
  html+='</div><div style="display:grid;gap:6px;margin-top:8px">';
  state.history.forEach(h=>{
    html+=`<div class="card soft" style="padding:8px"><div class="mono">${new Date(h.date).toLocaleString('it-IT')}</div><div class="mono">${h.km.toFixed(2)} km · ${Math.floor(h.time/60)}:${String(h.time%60).padStart(2,'0')} · ${h.avg.toFixed(1)} km/h</div><div style="margin-top:6px;display:flex;gap:6px"><button data-del="${h.id}">ELIMINA</button></div></div>`;
  });
  html+='</div>';
  modal.innerHTML=html;
  old.appendChild(back);
  old.appendChild(modal);
  $('#closeHistoryBtn').onclick=closeHistory;
  modal.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    state.history=state.history.filter(x=>x.id!=b.dataset.del);
    localStorage.setItem(store.k,JSON.stringify(state.history));
    openHistory();
    toast('Viaggio eliminato');
  });
}

function closeHistory(){
  document.getElementById('overlayRoot').innerHTML='';
}

function saveHist(){
  const item={id:Date.now(),date:new Date().toISOString(),km:+state.distance.toFixed(2),time:tripMinutes(),avg:+($('#avgSpeed').textContent||0),odo:+state.distance.toFixed(2)};
  state.history.unshift(item);
  localStorage.setItem(store.k,JSON.stringify(state.history));
  toast('Viaggio salvato');
}

async function keepScreenOn(){
  try{
    if(!('wakeLock' in navigator)){
      toast('Wake Lock non supportato');
      $('#status').textContent='Wake Lock non supportato';
      return;
    }
    if(state.wake){
      await state.wake.release();
      state.wake=null;
      $('#status').textContent='Schermo normale';
      toast('Schermo sbloccato');
    }else{
      state.wake=await navigator.wakeLock.request('screen');
      state.wake.addEventListener('release',()=>{state.wake=null});
      $('#status').textContent='Schermo sempre acceso';
      toast('Schermo bloccato acceso');
    }
  }catch(e){
    toast('Wake Lock non disponibile');
    $('#status').textContent='Wake Lock non disponibile';
  }
}

function bmsClick(e){
  e?.preventDefault?.();
  e?.stopPropagation?.();
  connectBms();
}

$('#saveTripBtn').onclick=saveHist;
$('#histBtn').onclick=openHistory;
$('#clearTripBtn').onclick=()=>{
  state.distance=0;
  state.odo=0;
  state.tripStart=Date.now();
  state.lastPos=null;
  $('#speed').textContent='0.0';
  $('#distance').textContent='0.00';
  $('#odo').textContent='0.00';
  $('#avgSpeed').textContent='0.0';
  arcForSpeed(0);
  toast('Viaggio resettato');
};

$('#connectBtn').onclick=bmsClick;
$('#protoTop').onclick=bmsClick;

renderBatteryNull();
arcForSpeed(0);
$('#protoTop').textContent='A';
$('#status').textContent='Pronto';
</script>
</body>
</html>
