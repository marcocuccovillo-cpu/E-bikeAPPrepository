<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0d67c5" />
<title>E-BIKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fb;--panel:#fff;--text:#152033;--muted:#6f7d91;--blue:#0d67c5;--green:#2aa84f;--line:#d7e1ec;--shadow:0 10px 22px rgba(18,28,45,.12);--danger:#ef5350;--warn:#f0b429;--gap:12px;--pad:14px;--cardr:18px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:Rajdhani,system-ui,sans-serif;color:var(--text)}
body{overflow:hidden;touch-action:manipulation}
.app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,#f5f8fe 0%, #e9eff8 100%)}
.main{flex:1;min-height:0;overflow:auto;padding:var(--pad) var(--pad) 132px;display:flex;flex-direction:column;gap:var(--gap);-webkit-overflow-scrolling:touch}
.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--cardr);box-shadow:var(--shadow)}
.hero{min-height:192px;display:grid;place-items:center;padding:10px 10px 12px;position:relative}
.gauge{width:min(100%,300px)}
.speed{font:700 40px/1 Barlow Condensed,sans-serif;margin-top:-3px}
.unit{font-size:14px;color:var(--muted)}
.gpsbars{position:absolute;left:16px;top:16px;display:grid;gap:4px}
.gpsbar{width:24px;height:4px;border-radius:999px;background:#dfe6ef;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.gpsbar i{display:block;height:100%;width:100%;border-radius:inherit}
.gpsbar.on1 i{background:#ef5350}.gpsbar.on2 i{background:#f0b429}.gpsbar.on3 i{background:#74d04b}.gpsbar.on4 i{background:#2aa84f}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:12px 12px 11px;min-height:74px}.label{font:700 11px/1 Barlow Condensed,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}.value{font:700 22px/1 Barlow Condensed,sans-serif;margin-top:4px}.mono{font-family:'Share Tech Mono',monospace;font-size:11px}
.weather{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;min-height:64px}.weather .temp{font:700 22px/1 Barlow Condensed,sans-serif}.weatherName{font:700 12px/1 Barlow Condensed,sans-serif;letter-spacing:1px;color:var(--muted)}
.trip{padding:12px 14px;min-height:88px}.tripGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.battery{padding:12px 14px}.batteryGrid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.range{font:700 32px/1 Barlow Condensed,sans-serif;color:var(--blue);text-align:right}.bar{height:8px;background:#d5dfeb;border-radius:999px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#74d04b)}
.shortcuts{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:12px 14px}.shortcut{min-height:56px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;text-decoration:none;color:var(--text)}.shortcut .ic{font-size:20px}.shortcut .tx{font:700 10px/1 Barlow Condensed,sans-serif;letter-spacing:.8px}
.cellsCard{padding:12px 14px}.cellsTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.cells{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cell{padding:6px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#f7fbff)}.cell .n{font:700 10px/1 Barlow Condensed,sans-serif;color:var(--muted)}.cell .mv{font:700 11px/1 'Share Tech Mono',monospace;margin-top:4px}.miniBar{height:6px;background:#d6dfeb;border-radius:999px;overflow:hidden;margin-top:5px}.miniBar i{display:block;height:100%;background:linear-gradient(90deg,var(--danger),var(--warn),var(--green))}
.footer{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(238,243,251,.05),rgba(238,243,251,.9) 18%, rgba(238,243,251,1) 100%);box-shadow:0 -8px 20px rgba(18,28,45,.08)}.status{font:700 11px/1 'Share Tech Mono',monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:var(--shadow);color:var(--text);padding:10px 16px;min-width:92px;font:700 10px/1 Barlow Condensed,sans-serif;letter-spacing:.8px}.btn.primary{background:linear-gradient(180deg,#2e7eea,#0d67c5);color:#fff;border-color:transparent}.btn.danger{background:#fff;color:#b00020;border-color:#f0c7d0}
.overlay{position:fixed;inset:0;background:rgba(14,20,32,.3);z-index:50}.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);max-height:72vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.25);z-index:60;padding:12px}.toastWrap{position:fixed;right:8px;bottom:8px;display:grid;gap:6px;z-index:9999}.toast{background:rgba(18,25,40,.95);color:#fff;padding:10px 12px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:min(340px,90vw)}.null{color:#98a3b7}.nullBox{min-height:44px;display:flex;align-items:center;justify-content:center;color:#98a3b7;border:1px dashed #d5dfeb;border-radius:12px;background:#fafcff}.spacer{height:4px}.wakeOn{background:linear-gradient(180deg,#27b35b,#1e8f47)!important;color:#fff!important;border-color:transparent!important}@media (max-height:780px){.main{padding:12px 12px 132px;gap:10px}.hero{min-height:176px}.grid2{gap:8px}.cells{gap:5px}}
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <section class="hero card">
      <div class="gpsbars" id="gpsbars">
        <div class="gpsbar"><i></i></div><div class="gpsbar"><i></i></div><div class="gpsbar"><i></i></div><div class="gpsbar"><i></i></div>
      </div>
      <svg class="gauge" viewBox="0 0 320 220"><defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0%" stop-color="#ff6d6d"/><stop offset="55%" stop-color="#ffd166"/><stop offset="100%" stop-color="#2aa84f"/></linearGradient></defs><path d="M42 170 A118 118 0 0 1 278 170" fill="none" stroke="#cfd8e4" stroke-width="20" stroke-linecap="round"/><path id="arc" d="M42 170 A118 118 0 0 1 278 170" fill="none" stroke="url(#g1)" stroke-width="20" stroke-linecap="round" stroke-dasharray="0 999"/><g id="needle" transform="translate(160 170)"><line x1="0" y1="0" x2="0" y2="-92" stroke="#1d2430" stroke-width="4" stroke-linecap="round"/><circle cx="0" cy="0" r="8" fill="#1d2430"/></g><text x="160" y="188" text-anchor="middle" class="mono" fill="#687689">KM/H</text></svg>
      <div class="speed"><span id="speed">0.0</span><span class="unit"> km/h</span></div>
    </section>

    <section class="grid2">
      <div class="card metric"><div class="label">LUMI / OGGI</div><div class="value" id="clock">--:--:--</div><div class="mono" id="date">--</div></div>
      <div class="card metric"><div class="label">DISTANZA</div><div class="value"><span id="distance">0.00</span> km</div><div class="mono">GPS</div></div>
    </section>

    <section class="card weather">
      <div style="font-size:24px">⛅</div>
      <div><div class="weatherName" id="weatherPlace">—</div><div class="temp"><span id="temp" class="null">—</span> °C</div></div>
      <div style="text-align:right"><div class="mono" id="weatherWind">—</div><div class="mono" id="weatherHum">—</div></div>
    </section>

    <section class="card trip">
      <div class="label">Trip</div>
      <div class="tripGrid" style="margin-top:8px"><div><div class="label">ODO</div><div class="value"><span id="odo">0.00</span> km</div></div><div style="text-align:right"><div class="label">V. media</div><div class="value"><span id="avgSpeed">0.0</span> km/h</div></div></div>
    </section>

    <section class="card battery">
      <div class="label">Batteria</div>
      <div class="batteryGrid" style="margin-top:8px"><div><div id="socBox" class="nullBox"><span id="soc" class="null">—</span></div><div class="mono" id="packInfo">—</div><div class="bar"><i id="packBar" style="width:0%"></i></div></div><div style="text-align:right"><div class="range"><span id="rangeKm" class="null">—</span> km</div><div class="mono">Autonomia est.</div></div></div>
    </section>

    <section class="card shortcutsCard">
      <div class="shortcuts">
        <a class="shortcut" href="tel:+390000000000"><div class="ic">📞</div><div class="tx">CALL</div></a>
        <a class="shortcut" href="https://maps.google.com" target="_blank" rel="noopener"><div class="ic">📍</div><div class="tx">MAPS</div></a>
        <a class="shortcut" href="https://open.spotify.com" target="_blank" rel="noopener"><div class="ic">🎵</div><div class="tx">SPOT</div></a>
        <button class="shortcut" id="connectBtn2"><div class="ic">🔌</div><div class="tx">BMS</div></button>
        <button class="shortcut" id="histBtn"><div class="ic">🕘</div><div class="tx">HIST</div></button>
        <button class="shortcut" id="gpsQuickBtn"><div class="ic">📡</div><div class="tx">GPS</div></button>
      </div>
    </section>

    <section class="card cellsCard">
      <div class="cellsTop"><div class="label">Celle</div><div class="mono" id="cellAlert">—</div></div>
      <div class="cells" id="cells"></div>
    </section>
    <div class="spacer"></div>
  </main>

  <footer class="footer">
    <div class="status" id="status">Pronto</div>
    <div class="actions">
      <button class="btn primary" id="saveTripBtn">SALVA</button>
      <button class="btn danger" id="clearTripBtn">RESET</button>
      <button class="btn" id="wakeBtn">SCHERMO</button>
    </div>
  </footer>
</div>
<div id="overlayRoot"></div><div class="toastWrap" id="toastWrap"></div>
<script>
const $=s=>document.querySelector(s), store={k:'ebikeDashboardV2'};
let state={speed:0,distance:0,odo:0,tripStart:Date.now(),lastPos:null,wake:null,gpsWatch:null,gpsOn:false,proto:'AUTO',soc:null,cells:[],history:JSON.parse(localStorage.getItem(store.k)||'[]'),weather:null,bmsDevice:null,gpsAccuracy:null};
let lastWeatherFetch=0,lastWeatherKey='';

function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;$('#toastWrap').appendChild(el);setTimeout(()=>el.remove(),2400)}
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('#date').textContent=d.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})} setInterval(tick,1000); tick();
function arcForSpeed(v){const p=Math.max(0,Math.min(1,v/50));const len=2*Math.PI*118*0.5;$('#arc').setAttribute('stroke-dasharray',`${len*p} ${999}`);$('#needle').setAttribute('transform',`translate(160 170) rotate(${-110+(220*p)})`)}
function hav(a,b){const R=6371,e=x=>x*Math.PI/180,dLat=e(b.lat-a.lat),dLon=e(b.lon-a.lon),lat1=e(a.lat),lat2=e(b.lat),h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function setGpsBars(acc){state.gpsAccuracy=acc;const bars=[15,8,5,3];$('#gpsbars').querySelectorAll('.gpsbar').forEach((el,i)=>{el.className='gpsbar';if(acc==null)return;if(acc<=bars[i])el.classList.add('on'+(i+1))})}
async function reversePlace(lat,lon){try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&language=it&format=json`,{cache:'no-store'});if(!r.ok) throw 0;const j=await r.json();const p=j.results?.[0];if(!p) return `GPS ${lat.toFixed(4)}, ${lon.toFixed(4)}`;return [p.name,p.admin1,p.country].filter(Boolean).join(', ')}catch(e){return `GPS ${lat.toFixed(4)}, ${lon.toFixed(4)}`}}
async function updateWeather(lat,lon){const key=`${Number(lat).toFixed(3)},${Number(lon).toFixed(3)}`;const now=Date.now();if(key===lastWeatherKey&&now-lastWeatherFetch<300000)return;lastWeatherKey=key;lastWeatherFetch=now;try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=auto`;const r=await fetch(u,{cache:'no-store'});if(!r.ok) throw new Error('weather '+r.status);const j=await r.json();const c=j.current||{};state.weather={temp:c.temperature_2m??null,hum:c.relative_humidity_2m??null,wind:c.wind_speed_10m??null,code:c.weather_code??null};$('#weatherPlace').textContent=await reversePlace(lat,lon);$('#temp').textContent=state.weather.temp==null?'—':Number(state.weather.temp).toFixed(1);$('#weatherHum').textContent=state.weather.hum==null?'Umidità —':`Umidità ${Math.round(state.weather.hum)}%`;$('#weatherWind').textContent=state.weather.wind==null?'Vento —':`Vento ${Number(state.weather.wind).toFixed(1)} km/h`;$('#status').textContent='Meteo aggiornato'}catch(e){state.weather=null;$('#weatherPlace').textContent='—';$('#temp').textContent='—';$('#weatherHum').textContent='—';$('#weatherWind').textContent='—';$('#status').textContent='Meteo non disponibile'}}
function startGps(){if(!navigator.geolocation){toast('GPS non supportato');$('#status').textContent='GPS non supportato';return}if(state.gpsOn)return;state.gpsOn=true;$('#status').textContent='GPS attivo';$('#gpsQuickBtn').style.borderColor='var(--green)';state.gpsWatch=navigator.geolocation.watchPosition(async p=>{const c=p.coords;if(typeof c.latitude!=='number'||typeof c.longitude!=='number'||Number.isNaN(c.latitude)||Number.isNaN(c.longitude))return;const cur={lat:c.latitude,lon:c.longitude};setGpsBars(c.accuracy!=null?c.accuracy:null);if(state.lastPos)state.distance+=hav(state.lastPos,cur);state.lastPos=cur;if(c.speed!=null&&c.speed>=0)state.speed=c.speed*3.6;$('#speed').textContent=state.speed.toFixed(1);$('#distance').textContent=state.distance.toFixed(2);$('#odo').textContent=state.distance.toFixed(2);$('#avgSpeed').textContent=state.distance>0?((state.distance)/(Math.max(1,(Date.now()-state.tripStart)/3600000))).toFixed(1):'0.0';arcForSpeed(state.speed);$('#status').textContent='GPS aggiornato';await updateWeather(c.latitude,c.longitude)},e=>{toast('GPS non disponibile: '+e.message);$('#status').textContent='GPS bloccato; abilita posizione nel browser';$('#gpsQuickBtn').style.borderColor='var(--line)';state.gpsOn=false;setGpsBars(null)},{enableHighAccuracy:true,maximumAge:1000,timeout:12000})}
function stopGps(){if(!state.gpsOn)return;navigator.geolocation.clearWatch(state.gpsWatch);state.gpsWatch=null;state.gpsOn=false;$('#gpsQuickBtn').style.borderColor='var(--line)';$('#status').textContent='GPS spento';setGpsBars(null)}
$('#gpsQuickBtn').onclick=()=>state.gpsOn?stopGps():startGps();

function renderBatteryNull(){state.soc=null;state.cells=[];$('#soc').textContent='—';$('#rangeKm').textContent='—';$('#packInfo').textContent='—';$('#packBar').style.width='0%';$('#cellAlert').textContent='—';$('#cells').innerHTML='';for(let i=0;i<14;i++){const el=document.createElement('div');el.className='cell';el.innerHTML=`<div class='n'>C${i+1}</div><div class='mv null'>—</div><div class='miniBar'><i style='width:0%'></i></div>`;$('#cells').appendChild(el)}}

async function connectBms(){const status=$('#status');status.textContent='Bluetooth: richiesta permesso...';try{if(!navigator.bluetooth){status.textContent='Bluetooth non supportato';toast('Bluetooth non supportato');renderBatteryNull();return}const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['battery_service','device_information','generic_access','generic_attribute']});state.proto=device.name||'BLE';status.textContent='Connesso al device scelto';toast('Device scelto: '+(device.name||'BLE'));state.bmsDevice=device;try{const server=await device.gatt.connect();let got=false;try{const svc=await server.getPrimaryService('battery_service');const ch=await svc.getCharacteristic('battery_level');const val=await ch.readValue();state.soc=val.getUint8(0);got=true;$('#packInfo').textContent='BMS reale · Battery Service';$('#packBar').style.width=state.soc+'%';$('#soc').textContent=String(state.soc)}catch(e){}status.textContent=got?('Connesso: '+(device.name||'BLE')+' · batteria letta'):('Connesso a '+(device.name||'BLE')+' (nessun dato batteria disponibile)')}catch(e){toast('Connessione non riuscita');status.textContent='Connessione non riuscita';renderBatteryNull()}}catch(e){status.textContent='Bluetooth annullato';toast('Bluetooth annullato');renderBatteryNull()}}
function tripMinutes(){return Math.max(0,Math.floor((Date.now()-state.tripStart)/60000))}
function openHistory(){const old=document.getElementById('overlayRoot');old.innerHTML='';const back=document.createElement('div');back.className='overlay';back.onclick=closeHistory;const modal=document.createElement('div');modal.className='modal';let html='<div class="row" style="display:flex;justify-content:space-between;align-items:center"><div class="label">Storico</div><button class="btn" id="closeHistoryBtn" style="min-width:72px">CHIUDI</button></div><div class="mono" style="margin-top:6px">';html+=`${state.history.length} viaggi · ${state.history.reduce((a,b)=>a+b.km,0).toFixed(1)} km`;html+='</div><div style="display:grid;gap:6px;margin-top:8px">';state.history.forEach(h=>{html+=`<div class="card" style="padding:8px"><div class="mono">${new Date(h.date).toLocaleString('it-IT')}</div><div class="mono">${h.km.toFixed(2)} km · ${Math.floor(h.time/60)}:${String(h.time%60).padStart(2,'0')} · ${h.avg.toFixed(1)} km/h</div><div style="margin-top:6px;display:flex;gap:6px"><button class="btn danger" data-del="${h.id}" style="min-width:88px">ELIMINA</button></div></div>`)}html+='</div>';modal.innerHTML=html;old.appendChild(back);old.appendChild(modal);$('#closeHistoryBtn').onclick=closeHistory;modal.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.history=state.history.filter(x=>x.id!=b.dataset.del);localStorage.setItem(store.k,JSON.stringify(state.history));openHistory();toast('Viaggio eliminato')})}
function closeHistory(){document.getElementById('overlayRoot').innerHTML=''}
function saveHist(){const item={id:Date.now(),date:new Date().toISOString(),km:+state.distance.toFixed(2),time:tripMinutes(),avg:+($('#avgSpeed').textContent||0),odo:+state.distance.toFixed(2)};state.history.unshift(item);localStorage.setItem(store.k,JSON.stringify(state.history));toast('Viaggio salvato')}
async function keepScreenOn(){try{if(!('wakeLock' in navigator)){toast('Wake Lock non supportato');$('#status').textContent='Wake Lock non supportato';return}if(state.wake){await state.wake.release();state.wake=null;$('#wakeBtn').classList.remove('wakeOn');$('#status').textContent='Schermo normale';toast('Schermo sbloccato')}else{state.wake=await navigator.wakeLock.request('screen');state.wake.addEventListener('release',()=>{state.wake=null;$('#wakeBtn').classList.remove('wakeOn')});$('#wakeBtn').classList.add('wakeOn');$('#status').textContent='Schermo sempre acceso';toast('Schermo bloccato acceso')}}catch(e){toast('Wake Lock non disponibile');$('#status').textContent='Wake Lock non disponibile'}}
function bmsClick(e){e?.preventDefault?.();e?.stopPropagation?.();connectBms()}
$('#saveTripBtn').onclick=saveHist;$('#histBtn').onclick=openHistory;$('#clearTripBtn').onclick=()=>{state.distance=0;state.odo=0;state.tripStart=Date.now();state.lastPos=null;$('#speed').textContent='0.0';$('#distance').textContent='0.00';$('#odo').textContent='0.00';$('#avgSpeed').textContent='0.0';arcForSpeed(0);toast('Viaggio resettato')};$('#wakeBtn').onclick=keepScreenOn;$('#connectBtn2').onclick=bmsClick;
function start(){renderBatteryNull();arcForSpeed(0);$('#status').textContent='Pronto';setGpsBars(null)}
start();
</script>
</body>
</html>
